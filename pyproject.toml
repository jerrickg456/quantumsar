[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumsar"
version = "0.1.0"
description = "SAR image segmentation as an MRF/QUBO solved with QAOA on Classiq, with classical baselines"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
