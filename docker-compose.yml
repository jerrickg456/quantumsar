# One command: docker compose up --build   ->  UI http://localhost:7860, API http://localhost:8000/docs
services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file:
      - path: config.env          # optional, git-ignored (Classiq M2M credentials)
        required: false
    environment:
      QUANTUMSAR_ALLOW_LIVE_CLASSIQ: ${QUANTUMSAR_ALLOW_LIVE_CLASSIQ:-0}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 7860 --server.address 0.0.0.0
    ports: ["7860:7860"]
    environment:
      QUANTUMSAR_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
