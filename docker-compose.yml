# One command: docker compose up --build   ->  http://localhost:7860  (UI)  ·  /docs (API)
services:
  app:
    build: .
    ports: ["7860:7860"]
    env_file:
      - path: config.env          # optional, git-ignored (Classiq M2M credentials)
        required: false
      - path: deploy/classiq_deploy.env   # optional, git-ignored: live Classiq for this container
        required: false
    environment:
      QUANTUMSAR_ALLOW_LIVE_CLASSIQ: ${QUANTUMSAR_ALLOW_LIVE_CLASSIQ:-0}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Optional classic Streamlit UI:  docker compose --profile streamlit up --build
  streamlit:
    profiles: ["streamlit"]
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      QUANTUMSAR_API_URL: http://app:7860
