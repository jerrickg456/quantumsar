name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QUANTUMSAR_DISABLE_CLASSIQ: "1"   # no credentials in CI: live Classiq tests are skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantumsar .
      - name: smoke test /health
        run: |
          docker run -d --name qs -p 7860:7860 quantumsar
          for i in $(seq 1 30); do curl -fs http://localhost:7860/health && curl -fs http://localhost:7860/ | grep -q QuantumSAR && exit 0; sleep 2; done
          docker logs qs; exit 1
